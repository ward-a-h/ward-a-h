name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ward-a-h
          template: classic
          config_display: large
          config_timezone: Asia/Karachi
          base: header, activity
          plugin_introduction: yes
          plugin_introduction_title: yes
